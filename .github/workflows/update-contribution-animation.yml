name: Update contribution binary clock

on:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/contribution-binary-clock.svg"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-binary-clock
  cancel-in-progress: true

jobs:
  update:
    name: Regenerate contribution animation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate generator
        run: bun run typecheck && bun test

      - name: Generate contribution binary clock
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          CONTRIBUTIONS_TOKEN: ${{ secrets.CONTRIBUTIONS_TOKEN || github.token }}
        run: bun run generate:contribution-animation

      - name: Commit updated animation
        run: |
          if git diff --quiet -- assets/contribution-binary-clock.svg; then
            echo "Contribution binary clock is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/contribution-binary-clock.svg
          git commit -m "chore: update contribution binary clock"
          git push
