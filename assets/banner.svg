<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#141a24"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5c7"/>
      <stop offset="50%" stop-color="#3ab7ff"/>
      <stop offset="100%" stop-color="#7c5cff"/>
      <animate attributeName="x1" values="0;1;0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="lineGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#232c38"/>
    </pattern>
  </defs>

  <rect width="1200" height="220" fill="url(#bg)"/>
  <rect width="1200" height="220" fill="url(#dots)"/>

  <!-- faint PCB trace lines in background -->
  <g stroke="#1c2531" stroke-width="1.2" fill="none" opacity="0.8">
    <path d="M0 40 H180 L200 60 H420"/>
    <path d="M0 180 H120 L140 160 H900 L920 180 H1200"/>
    <path d="M1000 20 V70 L980 90 V220"/>
    <path d="M760 0 V50 L780 70 H1200"/>
  </g>
  <g fill="#2b3a4d">
    <circle cx="200" cy="60" r="2.5"/>
    <circle cx="420" cy="60" r="2.5"/>
    <circle cx="140" cy="160" r="2.5"/>
    <circle cx="920" cy="180" r="2.5"/>
    <circle cx="980" cy="90" r="2.5"/>
    <circle cx="780" cy="70" r="2.5"/>
  </g>

  <!-- clock waveform, continuously flowing -->
  <path d="M40 62 H100 V32 H160 V62 H220 V32 H280 V62 H340 V32 H400 V62 H460 V32 H520 V62 H580 V32 H640 V62 H700 V32 H760 V62 H820 V32 H880 V62 H940 V32 H1000 V62 H1060 V32 H1120 V62 H1180 V32 H1200"
        fill="none" stroke="#00e5c7" stroke-width="2.5" stroke-linejoin="round"
        stroke-dasharray="14 8" filter="url(#lineGlow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-88" dur="1.4s" repeatCount="indefinite"/>
  </path>
  <text x="40" y="18" fill="#5b6b7d" font-family="Consolas, monospace" font-size="11">clk</text>

  <!-- data bus waveform, continuously flowing -->
  <path d="M40 112 H140 L155 97 H340 L355 112 H520 L535 97 H700 L715 112 H900 L915 97 H1080 L1095 112 H1200"
        fill="none" stroke="#3ab7ff" stroke-width="2.5" stroke-linejoin="round"
        stroke-dasharray="10 6" filter="url(#lineGlow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-64" dur="1.1s" repeatCount="indefinite"/>
  </path>
  <text x="40" y="142" fill="#5b6b7d" font-family="Consolas, monospace" font-size="11">rv32i_data[31:0]</text>

  <!-- status LED -->
  <circle cx="1160" cy="30" r="5" fill="#00e5c7">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- title -->
  <text x="600" y="176" text-anchor="middle" font-family="Consolas, monospace" font-size="48" font-weight="700"
        fill="url(#glow)" filter="url(#softGlow)" letter-spacing="2">
    RAHUL SHAH
  </text>
  <text x="600" y="202" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#8b949e">
    VLSI Engineer <tspan fill="#00e5c7">|</tspan> RISC-V Architect <tspan fill="#3ab7ff">|</tspan> RTL to GDSII
  </text>
</svg>
